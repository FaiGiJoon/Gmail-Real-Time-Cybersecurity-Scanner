<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gmail Cybersecurity Scanner Settings</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    label { display: block; font-weight: bold; margin: 14px 0 4px; }
    input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 15px; background: #1a73e8; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    #status { margin-top: 10px; color: #188038; font-weight: bold; }
    small { color: #5f6368; }
  </style>
</head>
<body>
  <h2>Scanner settings</h2>
  <label for="sb">Safe Browsing API key (optional)</label>
  <input type="text" id="sb" autocomplete="off">
  <small>Stored only in this browser. Links from scanned emails are sent to Google Safe Browsing when a key is set.</small>
  <label for="internal">Your own domain</label>
  <input type="text" id="internal" placeholder="example.com">
  <label for="vip">VIP names (comma separated)</label>
  <input type="text" id="vip">
  <label for="allow">Trusted domains</label>
  <input type="text" id="allow">
  <label for="deny">Blocked domains</label>
  <input type="text" id="deny">
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
