<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gmail Cybersecurity Scanner</title>
  <link rel="stylesheet" href="view.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="gcs-root">
  <header class="top">
    <img src="icons/icon48.png" alt="" width="24" height="24">
    <h1>Email Security</h1>
    <a id="settings" class="gcs-icon-btn" href="options.html" target="_blank" title="Settings" aria-label="Settings"></a>
  </header>

  <main id="main" aria-live="polite"></main>

  <footer class="toggles">
    <label class="switch"><input type="checkbox" id="autoScan"><span class="track" aria-hidden="true"></span>Scan emails automatically</label>
    <label class="switch"><input type="checkbox" id="showBanner"><span class="track" aria-hidden="true"></span>Show banner in Gmail</label>
  </footer>
  <script src="view.js"></script>
  <script src="popup.js"></script>
</body>
</html>
